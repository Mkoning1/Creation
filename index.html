<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oorsprong — beschavingssimulatie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #e7ebe5;
  --panel: #f3f5f1;
  --ink: #1d282c;
  --ink-2: #56646a;
  --rule: #c6cec6;
  --accent: #2b5f86;
  --bar: #dde3dc;
  --sea: #223e58;
  --font: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-c: "Barlow Semi Condensed", "Barlow", "Arial Narrow", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #151b1e; --panel: #1b2326; --ink: #dfe6e3; --ink-2: #8d9b9f;
    --rule: #2d383c; --accent: #8db3d2; --bar: #263034; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #151b1e; --panel: #1b2326; --ink: #dfe6e3; --ink-2: #8d9b9f;
  --rule: #2d383c; --accent: #8db3d2; --bar: #263034; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  background: var(--paper); color: var(--ink); font: 14px/1.4 var(--font);
  font-variant-numeric: tabular-nums; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden;
}
button, select { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* bovenbalk */
.top {
  display: flex; align-items: center; gap: 22px; padding: 8px 16px; border-bottom: 1px solid var(--rule);
  background: var(--panel); flex-wrap: wrap; min-height: 52px;
}
.brand { font: 600 19px/1 var(--font-c); letter-spacing: .02em; }
.clock { display: flex; align-items: baseline; gap: 12px; color: var(--ink-2); }
.clock b { font: 600 20px/1 var(--font-c); color: var(--ink); min-width: 3.1em; }
.speed { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.speed button { background: none; border: 0; padding: 5px 11px; cursor: pointer; border-right: 1px solid var(--rule); min-width: 42px; }
.speed button:last-child { border-right: 0; }
.speed button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.spacer { flex: 1; }
.status { color: var(--ink-2); font-size: 13px; }
.newworld { display: flex; gap: 8px; align-items: center; }
.newworld select { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 5px 6px; }
.btn { background: none; border: 1px solid var(--ink); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
.btn.armed { background: #a8432f; border-color: #a8432f; color: #fff; }

/* hoofdindeling */
main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 0; }
.map { position: relative; min-width: 0; min-height: 0; background: var(--sea); overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; }
#map.dragging { cursor: grabbing; }
.banner {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: var(--panel); color: var(--ink);
  border: 1px solid var(--rule); border-radius: 6px; padding: 6px 12px; font-size: 13px; pointer-events: none;
}
.hint { position: absolute; left: 12px; bottom: 10px; color: #e8eef0; font-size: 12px; text-shadow: 0 1px 2px rgba(0,0,0,.7); pointer-events: none; }
.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--panel); }
.zoom button { background: none; border: 0; border-bottom: 1px solid var(--rule); width: 46px; height: 32px; cursor: pointer; font-size: 17px; line-height: 1; }
.zoom button:last-child { border-bottom: 0; font-size: 13px; }

/* zijpaneel */
.side { border-left: 1px solid var(--rule); background: var(--panel); overflow-y: auto; min-height: 0; }
.sec { padding: 14px 16px; border-bottom: 1px solid var(--rule); }
.sec h2 { margin: 0 0 10px; font: 600 15px/1.2 var(--font-c); letter-spacing: .01em; }
.overview { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 10px; }
.overview .wide { grid-column: 1 / -1; flex-direction: row; align-items: baseline; gap: 8px; }
.overview div { display: flex; flex-direction: column; }
.overview span { color: var(--ink-2); font-size: 12px; }
.overview b { font: 600 17px/1.2 var(--font-c); }

.tribe { padding: 10px 0 12px; border-top: 1px solid var(--rule); cursor: pointer; }
.tribe:first-child { border-top: 0; padding-top: 0; }
.tribe .th { display: flex; align-items: center; gap: 8px; }
.tribe .sw { width: 12px; height: 12px; border-radius: 2px; flex: none; }
.tribe .nm { font: 600 16px/1.2 var(--font-c); }
.tribe .era { margin-left: auto; color: var(--ink-2); font-size: 13px; }
.tribe .tg { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; gap: 2px 8px; margin-top: 6px; }
.tribe .tg div { display: flex; flex-direction: column; }
.tribe .tg span { color: var(--ink-2); font-size: 12px; }
.tribe .tg b { font-weight: 500; }
.bar { height: 4px; background: var(--bar); border-radius: 2px; margin-top: 8px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); }
.tribe .sub { color: var(--ink-2); font-size: 12px; margin-top: 5px; }
.tribe.dead { cursor: default; opacity: .62; padding-bottom: 8px; }
.tribe.dead .tg, .tribe.dead .bar { display: none; }
.tribe:hover:not(.dead) .nm { text-decoration: underline; text-underline-offset: 3px; }

#graph { width: 100%; height: 130px; display: block; }

.insp-empty { color: var(--ink-2); font-size: 13px; }
.kv { display: grid; grid-template-columns: 92px 1fr; gap: 3px 10px; font-size: 13px; }
.kv span { color: var(--ink-2); }
.meter { display: flex; align-items: center; gap: 8px; }
.meter .bar { flex: 1; margin: 0; height: 5px; }
.insp-h { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.insp-h b { font: 600 16px/1.2 var(--font-c); }
.insp-h .sw { width: 12px; height: 12px; border-radius: 6px; }
.insp-actions { display: flex; gap: 8px; margin-top: 10px; }
.insp-actions .btn { padding: 4px 10px; font-size: 13px; }
.insp-actions .btn[aria-pressed="true"] { background: var(--ink); color: var(--panel); }

#log { list-style: none; margin: 0; padding: 0; font-size: 13px; }
#log li { display: grid; grid-template-columns: 76px 8px 1fr; gap: 8px; align-items: baseline; padding: 3px 0; }
#log .lt { color: var(--ink-2); font-size: 12px; }
#log .ld { width: 8px; height: 8px; border-radius: 2px; align-self: center; }

@media (max-width: 860px) {
  body { overflow: auto; height: auto; display: block; }
  main { grid-template-columns: 1fr; }
  .map { height: 62vh; }
  .side { border-left: 0; border-top: 1px solid var(--rule); overflow: visible; }
  .top { gap: 12px; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">Oorsprong</div>
  <div class="clock" id="clock"><b>06:00</b><span>Lente, dag 1</span><span>Jaar 1</span></div>
  <div class="speed" id="speed" role="group" aria-label="Simulatiesnelheid">
    <button data-s="0" title="Pauze (spatie)">Pauze</button>
    <button data-s="1" title="Toets 1">1×</button>
    <button data-s="3" title="Toets 2">3×</button>
    <button data-s="10" title="Toets 3">10×</button>
    <button data-s="30" title="Toets 4">30×</button>
  </div>
  <div class="spacer"></div>
  <div class="status" id="status"></div>
  <div class="newworld">
    <select id="tribeCount" aria-label="Aantal stammen">
      <option value="2">2 stammen</option><option value="3">3 stammen</option>
      <option value="4" selected>4 stammen</option><option value="5">5 stammen</option><option value="6">6 stammen</option>
    </select>
    <button class="btn" id="btnNew">Nieuwe wereld</button>
  </div>
</header>
<main>
  <section class="map" id="mapwrap">
    <canvas id="map" tabindex="0" aria-label="Wereldkaart"></canvas>
    <div class="banner" id="banner" hidden></div>
    <div class="hint">Slepen om te verschuiven, scrollen om te zoomen, klikken om te inspecteren</div>
    <div class="zoom">
      <button data-z="in" aria-label="Inzoomen">+</button>
      <button data-z="out" aria-label="Uitzoomen">−</button>
      <button data-z="fit" aria-label="Hele kaart">Alles</button>
    </div>
  </section>
  <aside class="side">
    <section class="sec"><div class="overview" id="overview"></div></section>
    <section class="sec"><h2>Stammen</h2><div id="tribes"></div></section>
    <section class="sec"><h2>Bevolking</h2><canvas id="graph"></canvas></section>
    <section class="sec"><h2>Inspectie</h2><div id="insp"></div>
      <div class="insp-actions" id="inspActions" hidden>
        <button class="btn" id="btnFollow" aria-pressed="false">Volgen</button>
        <button class="btn" id="btnClear">Sluiten</button>
      </div>
    </section>
    <section class="sec"><h2>Logboek</h2><ol id="log"></ol></section>
  </aside>
</main>

<script>
'use strict';
// ===== SIM-START =====
const W = 144, H = 100, N = W * H;
const TPS = 10;                       // ticks per seconde op 1×
const DAY = 600, SEASON_DAYS = 3, YEAR = DAY * SEASON_DAYS * 4;
const SEASONS = ['Lente', 'Zomer', 'Herfst', 'Winter'];
const WATER = 0, SAND = 1, GRASS = 2, FOREST = 3, ROCK = 4, DIRT = 5;
const T_NAME = ['Water', 'Zand', 'Gras', 'Bos', 'Rots', 'Kale grond'];
const WALK = [0, 1, 1, 1, 0, 1];
const BUILDABLE = [0, 1, 1, 0, 0, 1];
const BASE_COST = [99, 1.3, 1, 1.8, 99, 1.05];
const ROAD_TH = [25, 70, 150, 260];
const ROAD_F = [1, 0.9, 0.75, 0.62, 0.55];
const DX = [1, -1, 0, 0, 1, 1, -1, -1], DY = [0, 0, 1, -1, 1, -1, 1, -1];
const DC = [1, 1, 1, 1, 1.414, 1.414, 1.414, 1.414];
const RES_NAME = { food: 'voedsel', wood: 'hout', stone: 'steen' };
const SRC = {
  tree: { res: 'wood', rate: 5, role: 'Houthakker', verb: 'Hakt hout' },
  rock: { res: 'stone', rate: 7, role: 'Steenhouwer', verb: 'Hakt steen' },
  bush: { res: 'food', rate: 4, role: 'Verzamelaar', verb: 'Plukt bessen' },
  fish: { res: 'food', rate: 10, role: 'Visser', verb: 'Vist' },
};
const SOURCES = { food: ['bush', 'fish'], wood: ['tree'], stone: ['rock'] };
const BDEF = {
  center:   { n: 'Dorpskern', a: 'een dorpskern', w: 3, h: 3, cost: {}, work: 1, era: 0, cap: 4, claim: 9, drop: true },
  hut:      { n: 'Hut', a: 'een hut', w: 1, h: 1, cost: { wood: 12 }, work: 110, era: 0, cap: 2, claim: 3 },
  storage:  { n: 'Opslagplaats', a: 'een opslagplaats', w: 2, h: 2, cost: { wood: 25 }, work: 220, era: 0, claim: 5, drop: true },
  farm:     { n: 'Akker', a: 'een akker', w: 3, h: 3, cost: { wood: 15 }, work: 120, era: 1, claim: 3 },
  workshop: { n: 'Werkplaats', a: 'een werkplaats', w: 2, h: 2, cost: { wood: 30, stone: 15 }, work: 360, era: 1, claim: 4 },
  house:    { n: 'Huis', a: 'een stenen huis', w: 2, h: 2, cost: { wood: 18, stone: 18 }, work: 300, era: 2, cap: 5, claim: 4 },
  school:   { n: 'School', a: 'een school', w: 2, h: 2, cost: { wood: 35, stone: 30 }, work: 500, era: 2, claim: 5 },
  outpost:  { n: 'Nederzetting', a: 'een nieuwe nederzetting', w: 3, h: 3, cost: { wood: 60, stone: 25 }, work: 700, era: 2, cap: 4, claim: 9, drop: true },
  temple:   { n: 'Tempel', a: 'een tempel', w: 3, h: 3, cost: { wood: 40, stone: 110 }, work: 1300, era: 3, claim: 7 },
  market:   { n: 'Markt', a: 'een markt', w: 3, h: 3, cost: { wood: 60, stone: 40 }, work: 650, era: 3, claim: 6, drop: true },
  keep:     { n: 'Burcht', a: 'een burcht', w: 3, h: 3, cost: { wood: 80, stone: 200 }, work: 2200, era: 4, claim: 11 },
};
const ERAS = [
  { n: 'Stamtijd', need: 0, pop: 0 },
  { n: 'Landbouwtijd', need: 70, pop: 8, msg: 'ontdekt de landbouw' },
  { n: 'Bronstijd', need: 260, pop: 16, msg: 'leert brons bewerken' },
  { n: 'IJzertijd', need: 700, pop: 28, msg: 'betreedt de IJzertijd' },
  { n: 'Koninkrijk', need: 1600, pop: 45, msg: 'kroont een koning en wordt een koninkrijk' },
];
const MILES = [10, 25, 50, 100, 150];
const MAX_MOBS = 450;
const TRIBE_NAMES = ['Arden', 'Morvik', 'Thalos', 'Keshet', 'Velmar', 'Oduna', 'Brakka', 'Sirenne', 'Halvor', 'Ystra', 'Corvan', 'Elmira', 'Tovuk', 'Nadir', 'Esker', 'Liv'];
const COLORS = ['#c4524a', '#3d72b8', '#d19a2a', '#8b5fb3', '#2a9a93', '#c76a9a'];
const SYL_A = ['Ar', 'Bel', 'Cor', 'Da', 'El', 'Fen', 'Gar', 'Hil', 'Is', 'Jor', 'Ka', 'Lin', 'Mar', 'Nor', 'Os', 'Per', 'Ru', 'Sil', 'Tor', 'Ul', 'Ve', 'Wil', 'Yr', 'Zan', 'Bram', 'Fo', 'Gil', 'Hen', 'Lo', 'Mei', 'Ti', 'Aud'];
const SYL_B = ['a', 'e', 'o', 'en', 'ar', 'is', 'ul', 'wyn', 'dra', 'mir', 'rik', 'na', 'lin', 'ke', 'bert', 'da', 'mund', 'wen', 'gard', 'tje', 'ion', 'ra'];

const rnd = Math.random;
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const genName = () => pick(SYL_A) + pick(SYL_B);

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function makeNoise(rng) {
  const p = []; for (let i = 0; i < 256; i++) p.push(i);
  for (let i = 255; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  const P = new Uint8Array(512); for (let i = 0; i < 512; i++) P[i] = p[i & 255];
  const V = new Float32Array(256); for (let i = 0; i < 256; i++) V[i] = rng();
  const h = (a, b) => V[P[(P[a & 255] + b) & 255]];
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = h(xi, yi), b = h(xi + 1, yi), c = h(xi, yi + 1), d = h(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
}
function fbm(n, x, y, scale) {
  let s = 0, amp = 0.55, f = 1 / scale, tot = 0;
  for (let o = 0; o < 5; o++) { s += n(x * f, y * f) * amp; tot += amp; amp *= 0.5; f *= 2.03; }
  return s / tot;
}

// Afgeleide (niet opgeslagen) toestand
const D = {
  bmap: new Int32Array(N), owner: new Int32Array(N), comp: new Int32Array(N), resv: new Int32Array(N),
  roadLv: new Uint8Array(N), str: new Float32Array(N), dirtyFlag: new Uint8Array(N),
  mobById: new Map(), bldById: new Map(), tribeById: new Map(),
  dirty: [], fullDirty: true, terrDirty: true, bushList: [], fishList: [], mainComp: 0,
};
let S = null;

function resetDerived() {
  D.bmap.fill(-1); D.owner.fill(-1); D.comp.fill(-1); D.resv.fill(0); D.roadLv.fill(0); D.dirtyFlag.fill(0);
  D.mobById.clear(); D.bldById.clear(); D.tribeById.clear(); D.dirty.length = 0; D.fullDirty = true; D.terrDirty = true; D.bushList = []; D.fishList = [];
}
function markDirty(i) {
  if (D.fullDirty || D.dirtyFlag[i]) return;
  D.dirtyFlag[i] = 1; D.dirty.push(i);
  if (D.dirty.length > 6000) D.fullDirty = true;
}
function addLog(tr, m, k) {
  S.logSeq = (S.logSeq || 0) + 1;
  S.log.push({ seq: S.logSeq, t: S.tick, c: tr ? tr.color : null, m, k });
  if (S.log.length > 200) S.log.splice(0, S.log.length - 200);
}

// ---- tijd ----
const seasonIdx = () => Math.floor(S.tick / (DAY * SEASON_DAYS)) % 4;
const hourOf = () => (6 + (S.tick % DAY) / DAY * 24) % 24;
function isNightFor(m) { const h = hourOf(); return h >= 20.5 + m.nOff * 0.9 || h < 4.8 + m.nOff * 0.8; }
function fmtShort(tk) {
  const y = Math.floor(tk / YEAR) + 1, s = SEASONS[Math.floor(tk / (DAY * SEASON_DAYS)) % 4], d = Math.floor(tk / DAY) % SEASON_DAYS + 1;
  return `J${y} ${s.slice(0, 3).toLowerCase()} ${d}`;
}

// ---- kaart ----
function roadLevel(w) { let l = 0; while (l < 4 && w >= ROAD_TH[l]) l++; return l; }
function tileCost(i) { return BASE_COST[S.tile[i]] * ROAD_F[D.roadLv[i]]; }
function computeComp() {
  D.comp.fill(-1);
  const q = new Int32Array(N); const sizes = []; let c = 0;
  for (let s = 0; s < N; s++) {
    if (D.comp[s] !== -1 || !WALK[S.tile[s]]) continue;
    let h = 0, t = 0; q[t++] = s; D.comp[s] = c;
    while (h < t) {
      const i = q[h++], x = i % W, y = (i / W) | 0;
      for (let d = 0; d < 4; d++) {
        const nx = x + DX[d], ny = y + DY[d];
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        const ni = ny * W + nx;
        if (D.comp[ni] === -1 && WALK[S.tile[ni]]) { D.comp[ni] = c; q[t++] = ni; }
      }
    }
    sizes.push(t); c++;
  }
  let best = 0; for (let k = 1; k < sizes.length; k++) if (sizes[k] > sizes[best]) best = k;
  D.mainComp = best;
}
function isShore(i) {
  const x = i % W, y = (i / W) | 0;
  for (let d = 0; d < 4; d++) { const nx = x + DX[d], ny = y + DY[d]; if (nx >= 0 && ny >= 0 && nx < W && ny < H && S.tile[ny * W + nx] !== WATER) return true; }
  return false;
}
function rebuildLists() {
  D.bushList = []; D.fishList = [];
  for (let i = 0; i < N; i++) { if (S.bush[i] >= 0) D.bushList.push(i); if (S.tile[i] === WATER && isShore(i)) D.fishList.push(i); }
}

function genWorld(seed, nTribes) {
  const rng = mulberry32(seed);
  S = {
    v: 1, seed, tick: 0, nextId: 1, tribeTarget: nTribes, speed: 1, harsh: false, lastNewTribe: 0, logSeq: 0,
    tile: new Uint8Array(N), amt: new Uint16Array(N), bush: new Int8Array(N).fill(-1), wear: new Uint16Array(N), elev: new Uint8Array(N),
    tribes: [], mobs: [], buildings: [], log: [], hist: [],
  };
  resetDerived();
  const ne = makeNoise(rng), nm = makeNoise(rng), nb = makeNoise(rng);
  const e = new Float32Array(N), mo = new Float32Array(N);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    let v = fbm(ne, x, y, 34);
    const dx = x / (W - 1) * 2 - 1, dy = y / (H - 1) * 2 - 1;
    const d = Math.sqrt(dx * dx + dy * dy) / Math.SQRT2;
    v -= Math.max(0, d - 0.42) * 0.95;
    e[i] = v; mo[i] = fbm(nm, x + 57, y + 91, 20);
  }
  const sorted = Float32Array.from(e).sort();
  const q = p => sorted[Math.floor(p * (N - 1))];
  const wT = q(0.30), sT = q(0.335), rT = q(0.925), lo = sorted[0];
  const landM = []; for (let i = 0; i < N; i++) if (e[i] >= sT && e[i] < rT) landM.push(mo[i]);
  landM.sort((a, b) => a - b);
  const fT = landM[Math.floor(landM.length * 0.6)];
  for (let i = 0; i < N; i++) {
    const v = e[i];
    if (v < wT) { S.tile[i] = WATER; S.elev[i] = Math.max(0, Math.min(255, ((v - lo) / (wT - lo)) * 255)); }
    else if (v < sT) S.tile[i] = SAND;
    else if (v >= rT) { S.tile[i] = ROCK; S.amt[i] = 45 + Math.floor(rng() * 40); }
    else if (mo[i] > fT || rng() < 0.025) { S.tile[i] = FOREST; S.amt[i] = mo[i] > fT ? 16 + Math.floor(rng() * 14) : 8 + Math.floor(rng() * 6); }
    else {
      S.tile[i] = GRASS;
      const x = i % W, y = (i / W) | 0;

function tryLoad() {
  try {
    const raw = localStorage.getItem(SAVE_KEY); if (!raw) return false;
    const o = JSON.parse(raw); if (o.v !== 1) return false;
    deserialize(o);
    if (S.speed > 0 && o.savedAt) {
      const away = Date.now() - o.savedAt;
      debt = Math.min(MAX_DEBT, away / 1000 * TPS * S.speed);
      if (away > 60000) {
        const mins = Math.round(Math.min(away, MAX_DEBT / TPS / S.speed * 1000) / 60000);
        addLog(null, `Wereld hervat na ${mins >= 60 ? Math.floor(mins / 60) + ' u ' : ''}${mins % 60} min afwezigheid`, 'world');
      }
    }
    return true;
  } catch (e) { return false; }
}
function newWorld() {
  const seed = (Math.random() * 1e9) | 0;
  const sp = S ? S.speed : 1;
  genWorld(seed, +$('tribeCount').value);
  S.speed = sp || 1; setSpeed(S.speed);
  debt = 0; sel = null; follow = false;
  for (const el of tribeEls.values()) el.remove(); tribeEls.clear();
  $('log').innerHTML = ''; shownSeq = 0;
  fitView(); updateAll(); save();
}
let armedAt = 0;
$('btnNew').addEventListener('click', () => {
  const b = $('btnNew');
  if (Date.now() - armedAt < 3000) { armedAt = 0; b.textContent = 'Nieuwe wereld'; b.classList.remove('armed'); newWorld(); return; }
  armedAt = Date.now(); b.textContent = 'Klik nogmaals om te wissen'; b.classList.add('armed');
  setTimeout(() => { if (armedAt && Date.now() - armedAt >= 2900) { armedAt = 0; b.textContent = 'Nieuwe wereld'; b.classList.remove('armed'); } }, 3000);
});

function advance(budget) {
  const now = performance.now(), dt = now - lastFrame; lastFrame = now;
  if (dt > 0 && S.speed > 0) debt = Math.min(MAX_DEBT, debt + dt / 1000 * TPS * S.speed);
  const t0 = performance.now(); let n = 0;
  while (debt >= 1) { step(); debt -= 1; if ((++n & 15) === 0 && performance.now() - t0 > budget) break; }
}
function updateStatus() {
  const banner = $('banner');
  if (debt > TPS * 30) {
    const m = Math.ceil(debt / TPS / 60);
    banner.hidden = false; banner.textContent = `Wereld haalt de gemiste tijd in: nog ${m} min`;
  } else banner.hidden = true;
  const t = new Date(lastSaveT);
  $('status').textContent = !saveOk ? 'Opslaan niet beschikbaar in deze omgeving' : lastSaveT ? `Opgeslagen om ${pad2(t.getHours())}:${pad2(t.getMinutes())}` : '';
}
function updateAll() { updateClock(); updateOverview(); updateTribes(); updateInspector(); updateLog(); updateStatus(); renderGraph(); }
let lastUi = 0, lastGraph = 0;
function frame() {
  advance(debt > 300 ? 35 : 12);
  render();
  const now = performance.now();
  if (now - lastUi > 250) { updateClock(); updateOverview(); updateTribes(); updateInspector(); updateLog(); updateStatus(); lastUi = now; }
  if (now - lastGraph > 1500) { renderGraph(); lastGraph = now; }
  if (Date.now() - lastSaveT > 20000) save();
  requestAnimationFrame(frame);
}
// Op de achtergrond blijft de wereld doorlopen (browsers vertragen timers, de achterstand wordt bij terugkeer ingehaald)
setInterval(() => { if (document.hidden) { advance(250); if (Date.now() - lastSaveT > 60000) save(); } }, 1000);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);

if (!tryLoad()) genWorld((Math.random() * 1e9) | 0, 4);
setSpeed(S.speed);
$('tribeCount').value = String(Math.max(2, Math.min(6, S.tribeTarget)));
resize(); updateAll();
requestAnimationFrame(frame);
</script>
</body>
</html>
