<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oorsprong — beschavingssimulatie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #e7ebe5;
  --panel: #f3f5f1;
  --ink: #1d282c;
  --ink-2: #56646a;
  --rule: #c6cec6;
  --accent: #2b5f86;
  --bar: #dde3dc;
  --sea: #223e58;
  --font: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-c: "Barlow Semi Condensed", "Barlow", "Arial Narrow", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #151b1e; --panel: #1b2326; --ink: #dfe6e3; --ink-2: #8d9b9f;
    --rule: #2d383c; --accent: #8db3d2; --bar: #263034; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #151b1e; --panel: #1b2326; --ink: #dfe6e3; --ink-2: #8d9b9f;
  --rule: #2d383c; --accent: #8db3d2; --bar: #263034; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  background: var(--paper); color: var(--ink); font: 14px/1.4 var(--font);
  font-variant-numeric: tabular-nums; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden;
}
button, select { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* bovenbalk */
.top {
  display: flex; align-items: center; gap: 22px; padding: 8px 16px; border-bottom: 1px solid var(--rule);
  background: var(--panel); flex-wrap: wrap; min-height: 52px;
}
.brand { font: 600 19px/1 var(--font-c); letter-spacing: .02em; }
.clock { display: flex; align-items: baseline; gap: 12px; color: var(--ink-2); }
.clock b { font: 600 20px/1 var(--font-c); color: var(--ink); min-width: 3.1em; }
.speed { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.speed button { background: none; border: 0; padding: 5px 11px; cursor: pointer; border-right: 1px solid var(--rule); min-width: 42px; }
.speed button:last-child { border-right: 0; }
.speed button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.spacer { flex: 1; }
.status { color: var(--ink-2); font-size: 13px; }
.newworld { display: flex; gap: 8px; align-items: center; }
.newworld select { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 5px 6px; }
.btn { background: none; border: 1px solid var(--ink); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
.btn.armed { background: #a8432f; border-color: #a8432f; color: #fff; }

/* hoofdindeling */
main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 0; }
.map { position: relative; min-width: 0; min-height: 0; background: var(--sea); overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; }
#map.dragging { cursor: grabbing; }
.banner {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: var(--panel); color: var(--ink);
  border: 1px solid var(--rule); border-radius: 6px; padding: 6px 12px; font-size: 13px; pointer-events: none;
}
.mini { position: absolute; top: 12px; left: 12px; width: 230px; height: 160px; border: 1px solid rgba(255,255,255,.35); border-radius: 4px; cursor: crosshair; touch-action: none; box-shadow: 0 1px 6px rgba(0,0,0,.35); }
.hint { position: absolute; left: 12px; bottom: 10px; color: #e8eef0; font-size: 12px; text-shadow: 0 1px 2px rgba(0,0,0,.7); pointer-events: none; }
.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--panel); }
.zoom button { background: none; border: 0; border-bottom: 1px solid var(--rule); width: 46px; height: 32px; cursor: pointer; font-size: 17px; line-height: 1; }
.zoom button:last-child { border-bottom: 0; font-size: 13px; }

/* zijpaneel */
.side { border-left: 1px solid var(--rule); background: var(--panel); overflow-y: auto; min-height: 0; }
.sec { padding: 14px 16px; border-bottom: 1px solid var(--rule); }
.sec h2 { margin: 0 0 10px; font: 600 15px/1.2 var(--font-c); letter-spacing: .01em; }
.overview { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 10px; }
.overview .wide { grid-column: 1 / -1; flex-direction: row; align-items: baseline; gap: 8px; }
.overview div { display: flex; flex-direction: column; }
.overview span { color: var(--ink-2); font-size: 12px; }
.overview b { font: 600 17px/1.2 var(--font-c); }

.tribe { padding: 10px 0 12px; border-top: 1px solid var(--rule); cursor: pointer; }
.tribe:first-child { border-top: 0; padding-top: 0; }
.tribe .th { display: flex; align-items: center; gap: 8px; }
.tribe .sw { width: 12px; height: 12px; border-radius: 2px; flex: none; }
.tribe .nm { font: 600 16px/1.2 var(--font-c); }
.tribe .era { margin-left: auto; color: var(--ink-2); font-size: 13px; }
.tribe .tg { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; gap: 2px 8px; margin-top: 6px; }
.tribe .tg div { display: flex; flex-direction: column; }
.tribe .tg span { color: var(--ink-2); font-size: 12px; }
.tribe .tg b { font-weight: 500; }
.bar { height: 4px; background: var(--bar); border-radius: 2px; margin-top: 8px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); }
.tribe .sub { color: var(--ink-2); font-size: 12px; margin-top: 5px; }
.tribe.dead { cursor: default; opacity: .62; padding-bottom: 8px; }
.tribe.dead .tg, .tribe.dead .bar { display: none; }
.tribe:hover:not(.dead) .nm { text-decoration: underline; text-underline-offset: 3px; }

#graph { width: 100%; height: 130px; display: block; }

.insp-empty { color: var(--ink-2); font-size: 13px; }
.kv { display: grid; grid-template-columns: 92px 1fr; gap: 3px 10px; font-size: 13px; }
.kv span { color: var(--ink-2); }
.meter { display: flex; align-items: center; gap: 8px; }
.meter .bar { flex: 1; margin: 0; height: 5px; }
.insp-h { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.insp-h b { font: 600 16px/1.2 var(--font-c); }
.insp-h .sw { width: 12px; height: 12px; border-radius: 6px; }
.insp-actions { display: flex; gap: 8px; margin-top: 10px; }
.insp-actions .btn { padding: 4px 10px; font-size: 13px; }
.insp-actions .btn[aria-pressed="true"] { background: var(--ink); color: var(--panel); }

#log { list-style: none; margin: 0; padding: 0; font-size: 13px; }
#log li { display: grid; grid-template-columns: 76px 8px 1fr; gap: 8px; align-items: baseline; padding: 3px 0; }
#log .lt { color: var(--ink-2); font-size: 12px; }
#log .ld { width: 8px; height: 8px; border-radius: 2px; align-self: center; }

@media (max-width: 860px) {
  body { overflow: auto; height: auto; display: block; }
  main { grid-template-columns: 1fr; }
  .map { height: 62vh; }
  .side { border-left: 0; border-top: 1px solid var(--rule); overflow: visible; }
  .top { gap: 12px; }
  .hint { display: none; }
  .mini { width: 140px; height: 97px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

.clock .wx { color: var(--ink); }
.tribe .ruler { color: var(--ink-2); font-size: 12px; margin-top: 2px; }
.tribe .tg { grid-template-columns: 1.3fr 1fr 1fr 1fr; }
.tribe .bars { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
.tribe .bl span { color: var(--ink-2); font-size: 11px; }
.tribe .bl .bar { margin-top: 2px; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.badge { border: 1px solid; border-radius: 4px; padding: 0 6px; font-size: 11px; }
.tribe.dead .ruler, .tribe.dead .bars, .tribe.dead .badges { display: none; }
.list { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.list li { padding: 4px 0; border-top: 1px solid var(--rule); display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
.list li:first-child { border-top: 0; }
.list .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.list .st { margin-left: auto; font-size: 12px; }
.list .rv { color: var(--ink-2); font-size: 12px; min-width: 2.4em; text-align: right; }
.list li > b { font-weight: 600; }
.list li > b + .rv { margin-left: auto; }
.list .muted, .muted { color: var(--ink-2); font-size: 12px; }
.list li > .muted { width: 100%; }
.memh { margin: 10px 0 4px; font: 600 13px/1.2 var(--font-c); }
.mem { list-style: none; margin: 0; padding: 0; font-size: 12px; }
.mem li { padding: 2px 0; }
.mem .lt { color: var(--ink-2); margin-right: 6px; }
.tabs { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; margin-bottom: 10px; }
.tabs button { background: none; border: 0; padding: 3px 10px; cursor: pointer; font-size: 13px; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.kv { grid-template-columns: 88px 1fr; }
</style>
</head>

<header class="top">
  <div class="brand">Oorsprong</div>

  <div class="spacer"></div>
  <div class="status" id="status"></div>

<main>

      <button data-z="in" aria-label="Inzoomen">+</button>
      <button data-z="out" aria-label="Uitzoomen">−</button>
      <button data-z="fit" aria-label="Hele kaart">Alles</button>

  <aside class="side">

    <section class="sec"><h2>Geloven</h2><ul class="list" id="rels"></ul></section>
    <section class="sec"><h2>Bevolking</h2><canvas id="graph"></canvas></section>

        <button class="btn" id="btnClear">Sluiten</button>

  </aside>
</main>

// ---------- stamdenken: wat bouwen we? ----------
function tribeThink(tr) {

  while (tr.mile < MILES.length && pop >= MILES[tr.mile]) { addLog(tr, `${tr.name} telt ${MILES[tr.mile]} inwoners`, 'pop'); tr.mile++; }

  const by = t => tbDone(tr, t).length, cnt = t => tbType(tr, t).length;
  const priests = S.mobs.filter(m => m.t === tr.id && m.job === 'priester').length;
  tr.kRate = 0.0008 * Math.sqrt(adults) + by('school') * 0.003 + priests * 0.0003 + (by('temple') + by('cathedral')) * 0.002 + by('market') * 0.0015 + tr.tradeRoutes * 0.002 + (by('castle') + by('keep')) * 0.002;
  tr.drops = by('center') + by('outpost') + by('storage') + by('market') + by('dock');
  for (const k in tr.cool) if (tr.cool[k] < S.tick) delete tr.cool[k];
  assignHomes(tr);
  const soldiers = S.mobs.filter(m => m.t === tr.id && m.job === 'soldaat');
  tr.needWeapons = soldiers.some(m => !m.weap) && tr.stock.weapons < 2;

  // vastgelopen bouwplaatsen opruimen

  for (const s of sites) {
    if ((S.tick - s.placed > DAY * 5 && s.prog < 1 && haveTotal(s) === 0) || s.unreach > 12) {
      for (const k in s.pool) tr.stock[k] += s.pool[k]; for (const k in s.have) tr.stock[k] += s.have[k];

  const wants = [];

  if (needFarms) wants.push('farm');

  if (era >= 1 && cnt('dock') < Math.min(3, centersOf(tr).length)) wants.push('dock');
  if (tr.tripAvg > 12 && cnt('storage') < Math.min(8, 1 + Math.floor(pop / 30))) wants.push('storage');
  if (era >= 1 && !cnt('workshop')) wants.push('workshop');
  if (era >= 1 && cnt('forester') < Math.min(3, Math.ceil(pop / 60))) wants.push('forester');
  if (era >= 2 && cnt('mine') < 1 + Math.floor(pop / 40)) wants.push('mine');
  if (era >= 2 && by('mine') && cnt('smithy') < 1 + Math.floor(pop / 70)) wants.push('smithy');
  if (era >= 2 && !cnt('barracks') && (tr.threat > 0 || pop > 40 || (tr.wolfDeaths || 0) > 0)) wants.push('barracks');
  if (era >= 2 && (tr.atWar || tr.threat > 1) && cnt('tower') < 2 + centersOf(tr).length) wants.push('tower');
  if (era >= 2 && cnt('temple') < (tr.stateRel ? 1 + Math.floor(pop / 90) : 1)) wants.push('temple');
  if (era >= 2 && cnt('school') < 1 + Math.floor(pop / 45)) wants.push('school');
  if (era >= 2 && cnt('outpost') < 16 && pop >= 22 * (cnt('outpost') + 1)) wants.push('outpost');

    if (br) { const c = { wood: bc.wood * br.length, stone: bc.stone * br.length }; if (afford(tr, c)) { placeProject(tr, 'bridge', br, c, 250 * br.length); return; } }

    }

}
function startUpgrade(tr) {

// ---------- beroepen verdelen ----------
const JOB_SK = { verkenner: 'hunt', boer: 'farm', hout: 'wood', steen: 'stone', mijn: 'mine', vis: 'fish', jager: 'hunt', herder: 'herd', bouw: 'build', drager: 'build', smid: 'craft', ambacht: 'craft', molen: 'farm', priester: 'faith', soldaat: 'fight', handel: 'trade', bos: 'wood' };

function allocateJobs(tr) {

  const workers = [];
  for (const m of ms) {
    if (isChild(m)) { m.job = 'kind'; continue; }
    if (m.id === tr.leader) { m.job = 'leider'; continue; }
    if (isElder(m) && m.job !== 'priester') { if (m.job !== 'oud') remember(m, 'ging met pensioen'); m.job = 'oud'; continue; }
    if (m.job === 'kind' || m.job === 'oud' || m.job === 'leider') m.job = 'arb';
    workers.push(m);
  }
  const n = workers.length, by = t => tbDone(tr, t).length, cs = census(tr), rel = tr.stateRel || ms.some(m => m.rlg);
  const want = {
    soldaat: by('barracks') ? Math.ceil(n * (tr.atWar ? 0.22 : tr.threat > 1 ? 0.1 : 0.05)) : 0,
    priester: rel ? Math.min(Math.ceil(n * 0.05) + 1, by('temple') * 2 + by('cathedral') * 3 + 1) : 0,
    smid: by('smithy'), ambacht: by('smithy') ? 0 : by('workshop'), molen: by('mill'), herder: by('pasture'), bos: by('forester'),
    bouw: Math.min(Math.ceil(n * 0.22), cs.siteCount * 2), drager: Math.min(Math.ceil(n * 0.12), Math.ceil(cs.haulNeed * 1.2)),
    verkenner: n >= 5 ? 2 + (tr.era >= 2 ? 1 : 0) + (tr.era >= 4 ? 1 : 0) : 0,
    boer: Math.ceil(by('farm') * 0.7), mijn: Math.min(by('mine') * 2, Math.ceil(n * 0.12)), handel: Math.min(tr.orders.length, 4),
  };
  let fixed = 0; for (const k in want) fixed += want[k];
  if (fixed > n * 0.8) { const f = n * 0.8 / fixed; for (const k in want) want[k] = Math.floor(want[k] * f); fixed = 0; for (const k in want) fixed += want[k]; }
  const rest = Math.max(0, n - fixed), tg = targets(tr);
  const defF = Math.max(0, tg.food - tr.stock.food) / tg.food, defW = Math.max(0, tg.wood - tr.stock.wood) / tg.wood, defS = tg.stone ? Math.max(0, tg.stone - tr.stock.stone) / tg.stone : 0;
  const tot = defF + defW + defS + 0.6;
  want.vis = Math.round(rest * (defF * 0.45 + 0.1) / tot); want.jager = Math.round(rest * (defF * 0.25 + 0.05) / tot);
  want.hout = Math.round(rest * (defW + 0.15) / tot); want.steen = tr.era >= 1 ? Math.round(rest * (defS + 0.05) / tot) : 0;
  const count = {}; for (const m of workers) count[m.job] = (count[m.job] || 0) + 1;
  const free = [];
  for (const m of workers) {
    const w = m.job === 'arb' ? 0 : (want[m.job] || 0);
    if (count[m.job] > w) { count[m.job]--; free.push(m); }
  }
  for (const job of Object.keys(want)) {
    let need = want[job] - (count[job] || 0); if (need <= 0) continue;
    const sk = JOB_SK[job], amb = JOB_AMB[job];
    free.sort((a, b) => ((b.sk[sk] || 0) + (b.amb === amb ? 0.4 : 0) + (job === 'soldaat' && has(b, 'dapper') ? 0.3 : 0) + (job === 'priester' && has(b, 'vroom') ? 0.4 : 0)) -
      ((a.sk[sk] || 0) + (a.amb === amb ? 0.4 : 0) + (job === 'soldaat' && has(a, 'dapper') ? 0.3 : 0) + (job === 'priester' && has(a, 'vroom') ? 0.4 : 0)));

      const m = free.shift();
      if (m.job !== job) { m.job = job; remember(m, `werd ${JOBS[job].toLowerCase()}`); if (job === 'soldaat') m.mil = 0; }
      count[job] = (count[job] || 0) + 1; need--;

  }

}

// ---------- geboorte en gebeurtenissen ----------
function births(tr) {

  const roomy = tr.popCap > tr.pop || tr.homeless < 3;
  if (!roomy) return;

    const p = D.mobById.get(m.partner); if (!p || p.sex !== 'm') continue;
    const a = ageY(m); if (a < 18 || a > 42 || S.tick - m.lastBirth < DAY * 2.5) continue;

    const c = spawnMob(tr, h.x + (h.w >> 1), h.y + (h.h >> 1), 0, m, p);

}
function dailyEvents(tr) {

  if (tr.battleDead) { addLog(tr, `${tr.name} verloor ${tr.battleDead} ${tr.battleDead === 1 ? 'strijder' : 'mensen'} in de strijd`, 'war'); tr.battleDead = 0; }
  if (tr.wolfDeaths) { addLog(tr, `Wolven doodden ${tr.wolfDeaths} ${tr.wolfDeaths === 1 ? 'bewoner' : 'bewoners'} van ${tr.name}`, 'death'); tr.wolfDeaths = 0; }

  // malen met de hand als er geen molen is
  if (!tbDone(tr, 'mill').length && tr.stock.grain > 0) { const g = Math.min(tr.stock.grain, 30); tr.stock.grain -= g; addStock(tr, 'food', g); }
  const r = rnd();
  if (tr.pop >= 20 && r < 0.006) {
    const ms = S.mobs.filter(m => m.t === tr.id && !m.dead && !m.aboard);
    const k = Math.max(1, Math.round(ms.length * (0.06 + rnd() * 0.12)));
    for (let j = 0; j < k; j++) { const idx = j + Math.floor(rnd() * (ms.length - j)); [ms[j], ms[idx]] = [ms[idx], ms[j]]; killMob(ms[j], 'ziekte'); }
    chron(tr, `Een epidemie treft ${tr.name}: ${k} doden`);
  } else if (r < 0.03 && tr.era >= 1) {
    const fs = tbType(tr, 'farm').filter(b => b.done && b.stage === 1);
    if (fs.length) { for (const f of fs) { f.stage = 2; f.grow = 1; f.bonus = 1; markFootprint(f); } addLog(tr, `Uitzonderlijk goede oogst bij ${tr.name}`, 'event'); }
  } else if (r < 0.05) {
    const c = mainCenter(tr);
    if (c && S.mobs.length < MAX_MOBS) { const k = ri(2, 3); for (let j = 0; j < k; j++) spawnMob(tr, c.x + 1, c.y + 1, 18 + rnd() * 20); addLog(tr, `${k} nieuwkomers sluiten zich aan bij ${tr.name}`, 'event'); }
  }
  if (CUR_SEA === 1) { const c = mainCenter(tr); if (c && S.weather.dry[wCell(c.x, c.y)] > 0.75 && !tr.droughtLogged) { tr.droughtLogged = true; addLog(tr, `Droogte teistert de akkers van ${tr.name}`, 'event'); } }

}

// Gearrangeerde huwelijken als mensen elkaar niet vanzelf vinden
function matchmaking(tr) {

  const men = single.filter(m => m.sex === 'm'), women = single.filter(m => m.sex === 'v');

  let best = null, bs = -1e9;

// ---------- bestuur en politiek ----------

  let maxP = 10; for (const hh of hs) for (const k in hh.p) if (hh.p[k] > maxP) maxP = hh.p[k];
  const step = maxP > 600 ? 200 : maxP > 250 ? 100 : maxP > 120 ? 50 : maxP > 50 ? 20 : maxP > 20 ? 10 : 5;
  maxP = Math.ceil(maxP / step) * step;
  const L = 32, R = r.width - 4, T = 6, B = r.height - 18;
  c.strokeStyle = rule; c.lineWidth = 1; c.textAlign = 'right'; c.textBaseline = 'middle';
  for (let v = 0; v <= maxP; v += step) { const y = B - (v / maxP) * (B - T); c.beginPath(); c.moveTo(L, y + 0.5); c.lineTo(R, y + 0.5); c.stroke(); c.fillText(v, L - 6, y); }
  const t0 = hs[0].t, t1 = hs[hs.length - 1].t;
  c.textAlign = 'left'; c.textBaseline = 'top'; c.fillText('Jaar ' + yearOf(t0), L, B + 4);
  c.textAlign = 'right'; c.fillText('nu', R, B + 4);
  for (const tr of S.tribes) {
    c.strokeStyle = tr.color; c.lineWidth = 1.75; c.beginPath(); let on = false;
    for (const hh of hs) {
      const v = hh.p[tr.id]; if (v === undefined) { on = false; continue; }
      const x = L + (hh.t - t0) / (t1 - t0 || 1) * (R - L), y = B - (v / maxP) * (B - T);
      if (on) c.lineTo(x, y); else { c.moveTo(x, y); on = true; }
    }
    c.stroke();
  }
}
// ===== INVOER =====
function resize() {
  const r = $('mapwrap').getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const first = !view.w;
  view.w = r.width; view.h = r.height; view.dpr = dpr;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  sizeMini();
  if (first) cam.z = 16; camClamp();
}
new ResizeObserver(resize).observe($('mapwrap'));
function zoomAt(sx, sy, f) {
  const wx = (sx - view.w / 2) / cam.z + cam.x, wy = (sy - view.h / 2) / cam.z + cam.y;
  cam.z = clampZ(cam.z * f);
  cam.x = wx - (sx - view.w / 2) / cam.z; cam.y = wy - (sy - view.h / 2) / cam.z;
  camClamp();
}
function pickAt(sx, sy) {
  const s = cam.z, ox = view.w / 2 - cam.x * s, oy = view.h / 2 - cam.y * s;
  const wx = (sx - ox) / s, wy = (sy - oy) / s, rad = Math.max(0.7, 10 / s), lift = s >= 6.5 ? 0.18 : 0;
  let best = null, bd = rad * rad, kind = 'mob';
  for (const m of S.mobs) { if (m.asleep || m.aboard) continue; const d = (m.x - wx) ** 2 + (m.y - lift - wy) ** 2; if (d < bd) { bd = d; best = m; kind = 'mob'; } }
  for (const a of S.animals) { const d = (a.x - wx) ** 2 + (a.y - wy) ** 2; if (d < bd) { bd = d; best = a; kind = 'anim'; } }
  follow = false;
  if (best) { sel = { kind, obj: best }; return; }
  const tx = Math.floor(wx), ty = Math.floor(wy);
  if (tx < 0 || ty < 0 || tx >= W || ty >= H) { sel = null; return; }
  const i = ty * W + tx;
  if (D.bmap[i] >= 0 && D.bldById.get(D.bmap[i])) sel = { kind: 'bld', obj: D.bldById.get(D.bmap[i]) };
  else sel = { kind: 'tile', i };
}
const ptrs = new Map(); let downAt = null, moved = false, pinch = null;
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
  if (ptrs.size === 1) { downAt = { x: e.offsetX, y: e.offsetY }; moved = false; }
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: cam.z }; moved = true; }
});
cv.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.offsetX - p.x, dy = e.offsetY - p.y;
  p.x = e.offsetX; p.y = e.offsetY;
  if (ptrs.size === 1) {
    if (Math.hypot(e.offsetX - downAt.x, e.offsetY - downAt.y) > 4) { moved = true; follow = false; cv.classList.add('dragging'); }
    if (moved) { cam.x -= dx / cam.z; cam.y -= dy / cam.z; camClamp(); }
  } else if (ptrs.size === 2 && pinch) {
    const [a, b] = [...ptrs.values()];
    zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, (pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d) / cam.z);
  }
});
function endPtr(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 0) { cv.classList.remove('dragging'); if (!moved && e.type === 'pointerup' && S) { pickAt(e.offsetX, e.offsetY); updateInspector(); } }
}
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.offsetX, e.offsetY, Math.exp(-e.deltaY * 0.0016)); }, { passive: false });
let miniDrag = false;
function miniJump(e) { const r = mini.getBoundingClientRect(); focusOn((e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H); }
mini.addEventListener('pointerdown', e => { miniDrag = true; mini.setPointerCapture(e.pointerId); miniJump(e); });
mini.addEventListener('pointermove', e => { if (miniDrag) miniJump(e); });
mini.addEventListener('pointerup', () => { miniDrag = false; });
mini.addEventListener('pointercancel', () => { miniDrag = false; });
document.querySelector('.zoom').addEventListener('click', e => {
  const z = e.target.closest('button'); if (!z) return;
  if (z.dataset.z === 'fit') { follow = false; fitView(); } else zoomAt(view.w / 2, view.h / 2, z.dataset.z === 'in' ? 1.5 : 1 / 1.5);
});
$('tribes').addEventListener('click', e => {
  const el = e.target.closest('.tribe'); if (!el) return;
  const tr = D.tribeById.get(+el.dataset.id); if (!tr || !tr.alive) return;
  const c = mainCenter(tr); if (!c) return;
  focusOn(c.x + 1.5, c.y + 1.5, Math.max(cam.z, 14));
  sel = { kind: 'bld', obj: c }; updateInspector();
});
$('btnFollow').addEventListener('click', () => { follow = !follow; if (follow) cam.z = Math.max(cam.z, 20); updateInspector(); });
$('btnLeader').addEventListener('click', () => {
  const m = sel && sel.kind === 'bld' ? D.mobById.get((D.tribeById.get(sel.obj.t) || {}).leader) : null;
  if (m && !m.aboard) { sel = { kind: 'mob', obj: m }; follow = true; cam.z = Math.max(cam.z, 20); updateInspector(); }
});
$('btnClear').addEventListener('click', () => { sel = null; follow = false; updateInspector(); });
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
  logTab = b.dataset.tab;
  document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
  updateLog();
}));

let lastSpeed = 1;
function setSpeed(v) {
  if (v > 0) lastSpeed = v;
  S.speed = v;
  document.querySelectorAll('#speed button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.s === v ? 'true' : 'false'));
}
$('speed').addEventListener('click', e => { const b = e.target.closest('button'); if (b && S) setSpeed(+b.dataset.s); });
const PAN = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1], a: [-1, 0], d: [1, 0], w: [0, -1], s: [0, 1] };
window.addEventListener('keydown', e => {
  if (!S || e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  const pan = PAN[e.key];
  if (pan) { e.preventDefault(); follow = false; cam.x += pan[0] * view.w * 0.25 / cam.z; cam.y += pan[1] * view.h * 0.25 / cam.z; camClamp(); }
  else if (e.code === 'Space') { e.preventDefault(); setSpeed(S.speed > 0 ? 0 : lastSpeed); }
  else if (e.key >= '1' && e.key <= '4') setSpeed([1, 3, 10, 30][+e.key - 1]);
  else if (e.key === 'f' && sel && (sel.kind === 'mob' || sel.kind === 'anim')) { follow = !follow; updateInspector(); }
  else if (e.key === 'Escape') { sel = null; follow = false; updateInspector(); }
  else if (e.key === '+' || e.key === '=') zoomAt(view.w / 2, view.h / 2, 1.3);
  else if (e.key === '-') zoomAt(view.w / 2, view.h / 2, 1 / 1.3);
});

// ===== OPSLAG EN HOOFDLUS =====
const DB_NAME = 'oorsprong3', DB_STORE = 'wereld', DB_KEY = 'huidig';
let dbP = null, saving = false, saveOk = true, lastSaveT = 0;
function db() {
  if (!dbP) dbP = new Promise((res, rej) => {
    try { const r = indexedDB.open(DB_NAME, 1); r.onupgradeneeded = () => r.result.createObjectStore(DB_STORE); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
    catch (e) { rej(e); }
  });
  return dbP;
}
async function save() {
  if (saving || !S) return;
  saving = true; lastSaveT = Date.now();
  try {
    const d = await db();
    await new Promise((res, rej) => {
      const tx = d.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put(snapshot(), DB_KEY);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
    saveOk = true;
  } catch (e) { saveOk = false; }
  saving = false;
}
async function loadSave() {
  const d = await db();
  return new Promise((res, rej) => { const rq = d.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).get(DB_KEY); rq.onsuccess = () => res(rq.result || null); rq.onerror = () => rej(rq.error); });
}
const nextPaint = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
function showBanner(t) { const b = $('banner'); b.textContent = t; b.hidden = false; }
function focusFirstTribe() {
  const tr = S.tribes.filter(t => t.alive).sort((a, b) => b.pop - a.pop)[0];
  const c = tr && mainCenter(tr);
  if (c) focusOn(c.x + 1.5, c.y + 1.5, 18); else fitView();
}
async function newWorld() {
  showBanner('Nieuwe wereld wordt gemaakt…'); await nextPaint();
  const sp = S ? S.speed : 1;
  genWorld((Math.random() * 1e9) | 0, +$('tribeCount').value);
  setSpeed(sp || 1);
  liveDebt = 0; catchDebt = 0; sel = null; follow = false;
  for (const el of tribeEls.values()) el.remove(); tribeEls.clear();
  $('log').innerHTML = ''; shownSeq = 0; shownChron = 0;
  focusFirstTribe(); updateAll(); $('banner').hidden = true; save();
}
let armedAt = 0;
$('btnNew').addEventListener('click', () => {
  const b = $('btnNew');
  if (Date.now() - armedAt < 3000) { armedAt = 0; b.textContent = 'Nieuwe wereld'; b.classList.remove('armed'); newWorld(); return; }
  armedAt = Date.now(); b.textContent = 'Klik nogmaals om te wissen'; b.classList.add('armed');
  setTimeout(() => { if (armedAt && Date.now() - armedAt >= 2900) { armedAt = 0; b.textContent = 'Nieuwe wereld'; b.classList.remove('armed'); } }, 3000);
});

// Live tijd wordt niet opgespaard: haalt de computer het tempo niet, dan loopt de wereld trager.
// Gemiste tijd (tabblad op de achtergrond, browser dicht) wordt apart ingehaald, maximaal 2 uur.
const MAX_CATCH = TPS * 3600 * 2;
let liveDebt = 0, catchDebt = 0, lastFrame = performance.now();
function advance(budget, hidden) {
  const now = performance.now(), dt = now - lastFrame; lastFrame = now;
  if (dt > 0 && S.speed > 0) {
    const add = dt / 1000 * TPS * S.speed;
    if (hidden || dt > 1500) catchDebt = Math.min(MAX_CATCH, catchDebt + add); else liveDebt += add;
  }
  liveDebt = Math.min(liveDebt, TPS * S.speed * 0.25 + 1);
  const t0 = performance.now(); let n = 0;
  while (liveDebt >= 1 || catchDebt >= 1) {
    try { step(); } catch (e) { SIM_ERRORS++; S.tick++; }
    if (liveDebt >= 1) liveDebt--; else catchDebt--;
    if ((++n & 3) === 0 && performance.now() - t0 > budget) break;
  }
  RA = S.speed > 0 ? clamp(liveDebt, 0, 1) : 1;
}
function updateStatus() {
  const banner = $('banner');
  if (catchDebt > TPS * 20) { banner.hidden = false; banner.textContent = `Wereld haalt de gemiste tijd in: nog ${Math.ceil(catchDebt / TPS / 60)} min`; }
  else if (!banner.textContent.startsWith('Wereld wordt')) banner.hidden = true;
  const t = new Date(lastSaveT);
  $('status').textContent = !saveOk ? 'Opslaan niet beschikbaar in deze omgeving' : lastSaveT ? `Opgeslagen om ${pad2(t.getHours())}:${pad2(t.getMinutes())}` : '';
}
function updateAll() { updateClock(); updateOverview(); updateTribes(); updateDiplomacy(); updateReligions(); updateInspector(); updateLog(); updateStatus(); renderGraph(); }
let lastUi = 0, lastSlow = 0, lastGraph = 0;
function frame() {
  const now = performance.now();
  try {
    advance(catchDebt > 0 ? 30 : 14, false);
    render(now);
    if (now - lastUi > 250) { updateClock(); updateTribes(); updateInspector(); updateLog(); updateStatus(); lastUi = now; }
    if (now - lastSlow > 1500) { updateOverview(); updateDiplomacy(); updateReligions(); lastSlow = now; }
    if (now - lastGraph > 2000) { renderGraph(); lastGraph = now; }
    if (Date.now() - lastSaveT > 60000) save();
  } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
setInterval(() => { if (S && document.hidden) { advance(250, true); if (Date.now() - lastSaveT > 90000) save(); } }, 1000);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);

(async function boot() {
  showBanner('Wereld wordt geladen…'); await nextPaint();
  let loaded = false;
  try {
    const o = await loadSave();
    if (o && o.v === 3 && o.W === W && o.H === H) {
      restore(o); loaded = true;
      const away = Date.now() - (o.savedAt || Date.now());
      if (S.speed > 0 && away > 0) {
        catchDebt = Math.min(MAX_CATCH, away / 1000 * TPS * S.speed);
        if (away > 60000) { const mins = Math.round(catchDebt / TPS / S.speed / 60); addLog(null, `Wereld hervat, ${mins >= 60 ? Math.floor(mins / 60) + ' u ' : ''}${mins % 60} min wordt ingehaald`, 'world'); }
      }
    }
  } catch (e) { saveOk = false; }
  if (!loaded) { showBanner('Wereld wordt gemaakt…'); await nextPaint(); genWorld((Math.random() * 1e9) | 0, 4); }
  setSpeed(S.speed);
  $('tribeCount').value = String(clamp(S.tribeTarget, 2, 8));
  resize(); focusFirstTribe(); updateAll();
  $('banner').hidden = true; $('banner').textContent = '';
  lastFrame = performance.now();
  requestAnimationFrame(frame);
})();
